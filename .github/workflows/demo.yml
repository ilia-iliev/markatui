# The film in the README is made by the editor itself, so it can never be out of date.
# Every push that could change what the editor draws makes a fresh one and commits it.
name: Demo

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'sample/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'docs/demo.sh'
      - '.github/workflows/demo.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  demo:
    # A fork films the demo the same way and sees whether it still works; only the
    # repository the README's film lives in has anywhere to put a new one.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # A compositor, a terminal, a keyboard, a shutter, and a font to draw with.
      - name: Install the terminal
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            sway foot grim wtype jq ffmpeg fonts-dejavu-core xkb-data

      - uses: Swatinem/rust-cache@v2

      - name: Film it
        run: ./docs/demo.sh
        env:
          KEEP_FRAMES: ${{ runner.temp }}/frames

      # A film made where nobody can watch it is otherwise impossible to argue with.
      - name: Keep what it saw if it went wrong
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: frames
          path: ${{ runner.temp }}/frames

      # A fork has nowhere to commit the film to, and a protected main may refuse it.
      # Either way the run is worth something if the film can be taken off it by hand.
      - name: Keep the film
        uses: actions/upload-artifact@v4
        with:
          name: demo
          path: docs/demo.gif

      - name: Commit it if it changed
        if: github.repository == 'ilia-iliev/markatui' && github.ref == 'refs/heads/main'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add docs/demo.gif
          # Nothing to say when the editor draws what it drew last time.
          git diff --cached --quiet && exit 0
          git commit -m 'Refilm the demo [skip ci]'
          # Somebody may have pushed while this was filming, and main may not take a
          # push from a workflow at all: say which it was rather than failing blankly.
          git pull --rebase
          git push || {
              echo "::error::markatui: main refused the push."
              echo "::error::A branch protected against workflows needs the film committed by hand:"
              echo "::error::take docs/demo.gif off this run's artifacts and commit it."
              exit 1
          }
